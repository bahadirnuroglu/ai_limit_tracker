<!doctype html>
<meta charset="utf-8">
<title>Launch Film</title>
<script src="logos.js"></script>
<link rel="stylesheet" href="comp.css">
<style>
/* Tanıtım filmi: açık, havadar zemin (çok hafif hologram renk bulutu), solda büyük başlık + sağda kenardan taşan ürün,
   kelime kelime / harf harf yazılan tipografi, beyaza bulanıklaşan geçişler; ürün uygulamanın açık temasındaki gümüş kartlar */
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #fbfbfd }
#stage { position: relative; width: 1600px; height: 900px; overflow: hidden; color: #1d1d1f; font-family: var(--sf); -webkit-font-smoothing: antialiased; letter-spacing: -.02em }
.bg { position: absolute; inset: -10%; background:
  radial-gradient(38% 42% at 30% 35%, rgba(190,170,255,.28), transparent 70%),
  radial-gradient(34% 40% at 72% 62%, rgba(255,190,160,.26), transparent 70%),
  radial-gradient(30% 34% at 60% 20%, rgba(160,225,255,.22), transparent 70%), #fbfbfd }
.shot { position: absolute; inset: 0; overflow: hidden }
.t { position: absolute; font-weight: 600; letter-spacing: -.03em; line-height: 1.06; z-index: 10 }
.t .g { color: #86868b }
.t .a .wd, .t .a:not(:has(.wd)) { background: linear-gradient(90deg, #6e5ce7, #e8463a 60%, #ff9500); -webkit-background-clip: text; background-clip: text; color: transparent }
.t .ln { display: block }
.wd { display: inline-block; white-space: pre }
.left { left: 120px; top: 50%; transform: translateY(-50%); font-size: 74px; width: 620px }
.center { left: 0; right: 0; text-align: center }
.wash { position: absolute; inset: 0; background: #fff; z-index: 60; pointer-events: none; opacity: 0 }
.panel { position: absolute; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 100px rgba(40,30,80,.18), 0 0 0 1px rgba(0,0,0,.06) }
/* Masaüstü sahneleri: macOS Tahoe Day duvar kâğıdı */
.lwall { position: absolute; inset: 0; background: url(wall/tahoe-day.jpg) 30% 40% / cover }
.panel .mbar { background: rgba(255,255,255,.55); color: #1d1d1f }
.cur2 { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 30; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); opacity: 0 }
.list { width: 520px }
</style>
<body>
<div id="stage"></div>
<script>
const hp = location.hash.slice(1).split('-'), lang = hp[0] || 'en', dk = false, only = 'launch';
</script>
<script src="comp.js"></script>
<script src="launch.js"></script>
</body>
