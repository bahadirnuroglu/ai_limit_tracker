<!doctype html>
<meta charset="utf-8">
<title>Launch Film</title>
<script src="logos.js"></script>
<link rel="stylesheet" href="comp.css">
<style>
/* Tanıtım filmi: açık, havadar zemin (çok hafif hologram renk bulutu), solda büyük başlık + sağda kenardan taşan ürün,
   kelime kelime / harf harf yazılan tipografi, beyaza bulanıklaşan geçişler; ürün uygulamanın açık temasındaki gümüş kartlar */
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #fbfbfd }
/* Yazı: Apple tanıtımlarının dili — SF Pro Display; başlık Semibold, harf aralığı -0,02 em, satır 1,05; ikinci cümle #86868b */
#stage { position: relative; width: 1600px; height: 900px; overflow: hidden; color: #1d1d1f; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-synthesis: none; letter-spacing: -.015em }
/* Zemin: macOS duvar kâğıdı, yoğun bulanık + okunurluk perdesi (masaüstü sahnelerindeki net duvar kâğıdıyla aynı) */
.bg { position: absolute; inset: -12%; background: url(wall/tahoe-day.jpg) 40% 45% / cover; filter: blur(60px) saturate(1.25) }
.veil { position: absolute; inset: 0; background: rgba(250,250,252,.62) }
.shot { position: absolute; inset: 0; overflow: hidden }
.t { position: absolute; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; z-index: 10 }
.t .g { color: #86868b }
/* Vurgu kelimeleri düz renk (renk geçişli yazı kullanıcı isteğiyle kaldırıldı) */
.t .a .wd, .t .a { color: inherit }
.t .ln { display: block }
.wd { display: inline-block; white-space: pre }
.left { left: 120px; top: 50%; transform: translateY(-50%); font-size: 74px; width: 620px }
.center { left: 0; right: 0; text-align: center }
.wash { position: absolute; inset: 0; background: #fff; z-index: 60; pointer-events: none; opacity: 0 }
.panel { position: absolute; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 100px rgba(40,30,80,.18), 0 0 0 1px rgba(0,0,0,.06) }
/* Masaüstü sahneleri: macOS Tahoe Day duvar kâğıdı */
.lwall { position: absolute; inset: 0; background: url(wall/tahoe-day.jpg) 30% 40% / cover }
.panel .mbar { background: rgba(255,255,255,.55); color: #1d1d1f }
.mstrip { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(30px); display: flex; align-items: center; gap: 44px; padding-left: 44px; font-size: 34px; font-weight: 500; color: #1d1d1f; letter-spacing: -.01em }
#slot { display: grid; place-items: center; min-width: 180px; height: 76px; border-radius: 16px; background: rgba(0,0,0,.1) }
/* ---- Koyu sürüm: akşama çekilmiş Tahoe zemin, grafit kartlar (comp.css .dk) ---- */
.dk html, .dk body { background: #000 }
.dk #stage { color: #f5f5f7 }
/* Koyu: Tahoe Day akşama çekilmiş (lacivert perde + karartma); Apple'ın gece duvar kâğıdı bu Mac'te yok */
.dk .bg { background: linear-gradient(rgba(6,12,34,.55), rgba(6,12,34,.55)), url(wall/tahoe-day.jpg) 40% 45% / cover; filter: blur(60px) saturate(1.1) }
.dk .veil { background: rgba(0,0,0,.5) }
.dk .lwall { background: linear-gradient(rgba(4,10,30,.45), rgba(4,10,30,.45)), url(wall/tahoe-day.jpg) 30% 40% / cover }
.dk .panel { box-shadow: 0 40px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1) }
.dk .panel .mbar { background: rgba(0,0,0,.35); color: #fff }
.dk .mstrip { background: rgba(30,30,34,.6); color: #f5f5f7 }
.dk #slot { background: rgba(255,255,255,.14) }
.dk .wash { background: #000 }
.dk .list { box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) !important }
.cur2 { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 30; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); opacity: 0 }
.list { width: 520px }
</style>
<body>
<div id="stage"></div>
<script>
const hp = location.hash.slice(1).split('-'), lang = hp[0] || 'en', dk = hp.includes('dark'), only = 'launch';
if (dk) document.documentElement.classList.add('dk');
</script>
<script src="comp.js"></script>
<script src="launch.js"></script>
</body>
